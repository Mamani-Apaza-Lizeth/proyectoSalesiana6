{% extends "base.html" %}
{% block title %}Nueva venta - MiraLiz{% endblock %}
{% block content %}
<h2>Registrar venta presencial</h2>
<form method="post" class="card p-4">
    <div class="mb-3">
        <label class="form-label">Cliente</label>
        <input type="text" name="cliente_nombre" class="form-control" placeholder="Nombre del cliente (opcional)">
    </div>
    <div class="mb-3">
        <label class="form-label">Método de pago</label>
        <select name="metodo_pago" class="form-select">
            <option value="EFECTIVO">Efectivo</option>
            <option value="QR">QR</option>
            <option value="TARJETA">Tarjeta</option>
        </select>
    </div>

    <h5 class="mt-3">Productos</h5>
    <div id="lineas">
        <div class="row g-2 mb-2 linea">
            <div class="col-6">
                <select name="producto_id" class="form-select">
                    <option value="">Selecciona un producto</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}">{{ p.nombre }} (stock: {{ p.stock }}) - Bs. {{ "%.2f"|format(p.precio) }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-4">
                <input type="number" name="cantidad" min="1" value="1" class="form-control" placeholder="Cantidad">
            </div>
        </div>
    </div>
    <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="agregarLinea()">+ Agregar producto</button>
    <br>
    <button type="submit" class="btn btn-primary-miraliz">Registrar venta</button>
</form>

<script>
function agregarLinea() {
    const contenedor = document.getElementById('lineas');
    const nueva = contenedor.children[0].cloneNode(true);
    nueva.querySelectorAll('input').forEach(i => i.value = '1');
    nueva.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    contenedor.appendChild(nueva);
}
</script>
{% endblock %}
