{% extends "base.html" %}
{% block title %}Iniciar sesión - MiraLiz{% endblock %}

{% block content %}
<style>
    body {
        background-image: url('https://img.magnific.com/vector-premium/caida-puntos-color-sobre-fondo-oscuro-patron-divertido-ilustracion-circulos-punteados-colores-brillantes-abstractos-eps10_160081-456.jpg');
        background-size: cover;
        background-position: center;
    }
    .glass-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 24px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        color: #fbfafa;
    }
    .avatar-icon {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem auto;
        font-size: 2.5rem;
        color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .glass-input {
        background: rgba(255, 255, 255, 0.1) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        color: #ffffff !important;
        border-radius: 12px;
        padding: 0.75rem 1rem;
    }
    .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
    .glass-input:focus {
        background: rgba(255, 255, 255, 0.2) !important;
        box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        border-color: rgba(255, 255, 255, 0.4) !important;
    }
    .btn-glass {
        background: linear-gradient(90deg, #67448a 0%, #2850bc 100%);
        border: none;
        color: rgb(249, 247, 247);
        font-weight: 600;
        border-radius: 12px;
        padding: 0.75rem;
        transition: all 0.3s ease;
    }
    .btn-glass:hover {
        background: linear-gradient(90deg, #a821a6 0%, #9333ea 100%);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
    .toggle-link {
        color: #ffffff;
        text-decoration: underline;
        font-weight: 600;
    }
</style>

<div class="row justify-content-center align-items: center" style="min-height: 75vh;">
    <div class="col-md-5">
        <div class="glass-card p-4 mt-4 text-center">
            <div class="avatar-icon"><i class="bi bi-person-fill"></i></div>
            <h3 class="fw-bold mb-4">Iniciar sesión</h3>
            
            <form method="post">
                <div class="mb-3 text-start">
                    <label class="form-label text-light">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text glass-input border-end-0 text-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="correo" class="form-control glass-input border-start-0" placeholder="correo@ejemplo.com" required autofocus>
                    </div>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label text-light">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text glass-input border-end-0 text-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control glass-input border-start-0" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-glass w-100 mb-3">Entrar al Portal</button>
            </form>
            
            <p class="mb-0 text-light opacity-75">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}" class="toggle-link">Regístrate</a></p>
        </div>
    </div>
</div>
{% endblock %}
