{% extends "base.html" %}
{% block title %}Nuevo empleado - Admin{% endblock %}
{% block content %}
<h2>Nuevo empleado</h2>
<form method="post" class="card p-4" style="max-width:450px;">
    <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" name="nombre_completo" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" name="correo" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Horas disponibles (por periodo de producción)</label>
        <input type="number" step="0.5" name="horas_disponibles" class="form-control" value="40">
    </div>
    <div class="mb-3">
        <label class="form-label">Contraseña inicial</label>
        <input type="password" name="password" class="form-control" placeholder="Por defecto: miraliz123">
    </div>
    <button type="submit" class="btn btn-primary-miraliz">Crear empleado</button>
</form>
{% endblock %}
