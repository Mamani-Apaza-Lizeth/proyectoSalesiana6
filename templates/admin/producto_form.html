{% extends "base.html" %}
{% block title %}{{ "Editar" if producto else "Nuevo" }} producto - Admin{% endblock %}
{% block content %}
<h2>{{ "Editar" if producto else "Nuevo" }} producto</h2>
<form method="post" class="card p-4" style="max-width:500px;">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" value="{{ producto.nombre if producto else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control">{{ producto.descripcion if producto else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Categoría</label>
        <input type="text" name="categoria" class="form-control" value="{{ producto.categoria if producto else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-select">
            <option value="PRODUCTO_LISTO" {% if producto and producto.tipo == "PRODUCTO_LISTO" %}selected{% endif %}>Producto listo</option>
            <option value="PRODUCTO_PERSONALIZADO" {% if producto and producto.tipo == "PRODUCTO_PERSONALIZADO" %}selected{% endif %}>Producto personalizado</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Precio (Bs.)</label>
        <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio if producto else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Stock (solo productos listos)</label>
        <input type="number" name="stock" class="form-control" value="{{ producto.stock if producto else 0 }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Horas estimadas de producción (por unidad)</label>
        <input type="number" step="0.1" name="horas_estimadas" class="form-control" value="{{ producto.horas_estimadas if producto else 0 }}">
    </div>
    <button type="submit" class="btn btn-primary-miraliz">Guardar</button>
</form>
{% endblock %}
