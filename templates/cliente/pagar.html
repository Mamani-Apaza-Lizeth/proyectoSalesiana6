{% extends "base.html" %}
{% block title %}Pagar pedido #{{ pedido.id }} - MiraLiz{% endblock %}
{% block content %}
<h2>Pagar pedido #{{ pedido.id }}</h2>
<p>Total: Bs. {{ "%.2f"|format(pedido.total) }} — Saldo pendiente: <strong>Bs. {{ "%.2f"|format(pedido.saldo_pendiente) }}</strong></p>

<div class="card p-4" style="max-width:450px;">
    <div class="mb-3">
        <label class="form-label">Monto a pagar</label>
        <input type="number" id="monto" class="form-control" value="{{ pedido.saldo_pendiente }}" min="1" step="0.01">
    </div>
    <div class="mb-3">
        <label class="form-label">Método de pago</label>
        <select id="metodo" class="form-select">
            <option value="EFECTIVO">Efectivo</option>
            <option value="QR">QR</option>
            <option value="TARJETA">Tarjeta</option>
        </select>
    </div>
    <button class="btn btn-primary-miraliz" onclick="pagar()">Pagar</button>
    <div id="resultado" class="mt-3"></div>
</div>

<script>
async function pagar() {
    const monto = parseFloat(document.getElementById('monto').value);
    const metodo = document.getElementById('metodo').value;
    const resultadoDiv = document.getElementById('resultado');
    resultadoDiv.innerHTML = '<em>Procesando pago...</em>';

    try {
        const response = await fetch("{{ url_for('api.registrar_pago') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pedido_id: {{ pedido.id }}, monto: monto, metodo: metodo })
        });
        const data = await response.json();
        if (data.status === "success") {
            resultadoDiv.innerHTML = `<div class="alert alert-success">✓ Pago aprobado. Transacción: ${data.transaction_id}</div>`;
            setTimeout(() => window.location.href = "{{ url_for('cliente.detalle_pedido', pedido_id=pedido.id) }}", 1500);
        } else {
            resultadoDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
    } catch (e) {
        resultadoDiv.innerHTML = '<div class="alert alert-danger">Error de conexión con la API de pago.</div>';
    }
}
</script>
{% endblock %}
